server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: auth-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/auth_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/stu}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/stu/protocol/openid-connect/certs}
          audiences: stu-api
          authorities-claim-name: roles
          authority-prefix: ROLE_

app:
  security:
    api-key-encryption-secret: ${API_KEY_ENCRYPTION_SECRET:mekD0daFxQiVDPteEfgMxQKF5nQ63SdUehRumBS7S2I=}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: stu-swagger
      use-pkce-with-authorization-code-grant: true

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "
