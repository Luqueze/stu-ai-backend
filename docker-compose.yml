services:
  postgres:
    image: postgres:16
    container_name: ai-exam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ai-exam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-exam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: ai-exam-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - ai-exam-network

  keycloak-db-init:
    image: postgres:16
    container_name: ai-exam-keycloak-db-init
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "psql -h postgres -U ${DB_USER} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'keycloak_db'\" | grep -q 1
      || psql -h postgres -U ${DB_USER} -d postgres -c 'CREATE DATABASE keycloak_db'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-exam-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ai-exam-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && while read -r line <&3; do [[ $$line == *UP* ]] && exit 0; done; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ai-exam-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:-mekD0daFxQiVDPteEfgMxQKF5nQ63SdUehRumBS7S2I=}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/stu
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stu/protocol/openid-connect/certs
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ai-exam-network

  exam-service:
    build:
      context: .
      dockerfile: services/exam-service/Dockerfile
    container_name: ai-exam-exam-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/stu
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stu/protocol/openid-connect/certs
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ai-exam-network

  ai-generator-service:
    build:
      context: .
      dockerfile: services/ai-generator-service/Dockerfile
    container_name: ai-exam-ai-generator-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8089
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    ports:
      - "8089:8089"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ai-exam-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ai-exam-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      AUTH_SERVICE_URL: http://auth-service:8087
      EXAM_SERVICE_URL: http://exam-service:8088
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/stu
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/stu/protocol/openid-connect/certs
    ports:
      - "8086:8086"
    depends_on:
      - keycloak
      - auth-service
      - exam-service
    networks:
      - ai-exam-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ai-exam-network:
    driver: bridge
