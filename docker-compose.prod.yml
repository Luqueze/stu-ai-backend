services:
  redis:
    image: redis:7
    container_name: ai-exam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "redis"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ai-exam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai-exam-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "rabbitmq"

  auth-service:
    image: lucas6243/ai-exam-auth-service:latest
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ai-exam-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      PASSWORD_RESET_TOKEN_EXPIRATION_MS: ${PASSWORD_RESET_TOKEN_EXPIRATION_MS:-1800000}
    networks:
      - ai-exam-network
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "auth-service"

  exam-service:
    image: lucas6243/ai-exam-exam-service:latest
    build:
      context: .
      dockerfile: services/exam-service/Dockerfile
    container_name: ai-exam-exam-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai-exam-network
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "exam-service"

  ai-generator-service:
    image: lucas6243/ai-exam-ai-generator-service:latest
    build:
      context: .
      dockerfile: services/ai-generator-service/Dockerfile
    container_name: ai-exam-ai-generator-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8089
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ai-exam-network
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "ai-generator-service"

  api-gateway:
    image: lucas6243/ai-exam-api-gateway:latest
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ai-exam-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      AUTH_SERVICE_URL: http://auth-service:8087
      EXAM_SERVICE_URL: http://exam-service:8088
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8086:8086"
    depends_on:
      - auth-service
      - exam-service
    networks:
      - ai-exam-network
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ai-exam/prod
        awslogs-create-group: "true"
        tag: "api-gateway"

volumes:
  redis_data:
  rabbitmq_data:

networks:
  ai-exam-network:
    driver: bridge
